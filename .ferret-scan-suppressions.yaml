# The repository self-scan ledger: the HIGH findings ferret-scan reports in its own tree that are not
# sensitive data, each with the reason it is allowed to stay. scripts/self-scan.sh applies this file
# through .ferret-scan/selfscan.yaml and blocks on any HIGH finding it does not cover; see
# docs/testing/SELF_SCAN.md for the two gates, the excludes and the three-way decision a new HIGH needs.
#
# Every rule is enabled and has no expiry, and its reason is one of three kinds:
#   fixture: <why this value has to look real where it is>
#   detector FP: #NNN   (the issue that fixes the detector; the rule goes when it lands)
#   public: <why the value is legitimately public>   (licence attributions, the code-of-conduct address)
# A real credential or a real person's private data is never a rule: it is removed from the tree.
#
# A rule matches a finding by its identity hash (type, line, file basename, line number, surrounding
# text, value); its metadata names the finding for a reader. Regenerate with
#   scripts/self-scan.sh --regenerate <candidate>
# which keeps every rule byte for byte, re-anchors the ones whose finding moved (#918), and adds a
# disabled rule for each new HIGH finding to review. --generate-suppressions keeps this header: a save
# rewrites only the fields it changed and appends new rules (#866), and never rewrites a file it
# cannot parse (#880).


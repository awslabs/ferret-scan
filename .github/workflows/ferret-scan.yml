# Ferret Scan GitHub Actions Workflow: this repository's scan of its own tree (#927)
#
# The scan is scripts/self-scan.sh, which reads the committed profile .ferret-scan/selfscan.yaml (what
# is excluded, and why) and the reviewed suppression ledger it names, .ferret-scan-suppressions.yaml.
# The script owns every scan flag: two gates (shippable files with every check, *_test.go with
# --checks SECRETS), both at --confidence high with --fail-on-incomplete and --limit 0, counts from
# each report's `stats` with `stats.suppressed` beside them, and a report-only pass over the excluded
# paths. The gate is HIGH by definition, so this workflow takes no confidence input.
# docs/testing/SELF_SCAN.md is the guide: the ledger, and the three decisions a new HIGH finding can
# be (a real value is removed; a detector false positive is fixed, with a `detector FP: #NNN` rule
# meanwhile; a fixture takes a reserved value or a `fixture: <why>` rule).
#
# A pull request scans the files it adds, copies, modifies or renames, whatever their extension: the
# script decides what to scan and skips nothing silently. A push to main, and a full-repository
# dispatch, scan the whole tree. The push scan runs after the merge, so it cannot stop one; it is how
# a validator change that newly flags a file no pull request touched shows up on main.
#
# GATE_MODE (block | report, set in `env:` below) decides what the last step does with HIGH findings:
#
#   block   an unsuppressed HIGH finding fails the check. This repository blocks on HIGH since #927.
#   report  HIGH findings are counted, logged and put in the PR comment and job summary exactly as
#           in block mode, but do not fail the check.
#
# In BOTH modes the gate fails closed: a scan that failed or did not fully examine a file (the
# script's exit 2), a summary.env that is missing or holds a count that is not a number, an unknown
# GATE_MODE, or a scan that was due and did not run, fails the check.
#
# From #767 to #927 this repository ran `report`: its corpora carry deliberate HIGH findings and the
# old 245-rule baseline had expired (#696). Before #767 the gate never fired anywhere: it compared the
# NUMERIC `confidence` field to "HIGH", so every run counted 0 findings.
#
# A copy in another repository needs scripts/self-scan.sh, a profile and a ledger of its own.

name: Ferret Scan Security Check

on:
  # Every pull request. No `paths:` filter: the scan decides what to read, and a filter on extensions
  # let a change to a Markdown file or a test through unscanned. No `branches:` filter on purpose
  # either, see go-test.yml: a branch filter gave stacked PRs (base = another feature branch) zero
  # checks, and a secret introduced on a stacked branch would have reached main having never been
  # scanned by the tool itself.
  pull_request:

  # Run on pushes to main
  push:
    branches: [main]

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      scan_scope:
        description: 'Scan scope'
        required: false
        default: 'changed-files'
        type: choice
        options:
          - 'changed-files'
          - 'full-repository'

permissions:
  contents: read
  pull-requests: write

env:
  # block | report: see the header. This repository blocks on HIGH since #927.
  GATE_MODE: block

jobs:
  build:
    uses: ./.github/workflows/build-shared.yml
    with:
      build-type: 'binary'
    permissions:
      contents: read

  ferret-scan:
    name: Sensitive Data Detection
    runs-on: ubuntu-24.04
    needs: build

    # Read-only on the repository; pull-requests: write is for the results comment.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the changed-files step diffs a pull request against its merge base.
          fetch-depth: 0

      - name: Download binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ferret-scan-binary-${{ github.sha }}
          path: bin/

      - name: Make binary executable
        run: chmod +x bin/ferret-scan

      - name: Determine scan scope
        id: scope
        # Event/input context is passed via env and referenced as "$VAR" so a
        # crafted input value cannot inject shell commands (GitHub Actions
        # script-injection hardening).
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SCAN_SCOPE: ${{ github.event.inputs.scan_scope }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "scope=$INPUT_SCAN_SCOPE" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            echo "scope=changed-files" >> "$GITHUB_OUTPUT"
          else
            echo "scope=full-repository" >> "$GITHUB_OUTPUT"
          fi

      - name: Get changed files (PR only)
        if: steps.scope.outputs.scope == 'changed-files'
        id: changed-files
        # SHAs come from the (untrusted) pull_request event; pass via env and
        # reference as "$VAR" so they cannot inject shell commands.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Every file the change adds, copies, modifies or renames, whatever its extension: the
          # script decides what to scan. Names unquoted (core.quotePath=false): the script refuses a
          # name git quoted rather than skip it.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Three dots: against the merge base, so only the files the pull request changed. The
            # checkout is the merge commit, and the two-dot diff against the base tip also lists the
            # files main changed since the branch point, including files main deleted, which are not
            # in the checkout and fail the scan.
            git -c core.quotePath=false diff --name-only --diff-filter=ACMR \
              "$BASE_SHA...$HEAD_SHA" > changed_files.txt
          else
            # A dispatch with scan_scope changed-files: the last commit.
            git -c core.quotePath=false diff --name-only --diff-filter=ACMR \
              HEAD~1 HEAD > changed_files.txt
          fi

          if [ -s changed_files.txt ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            echo "Changed files to scan:"
            cat changed_files.txt
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No file was added, copied, modified or renamed"
          fi

      # NOTE: Ferret Scan findings are intentionally NOT uploaded to the GitHub
      # Security tab as SARIF. They are scan results about arbitrary repo content
      # (test fixtures, example secrets, the scanner's own output), not
      # vulnerabilities in this repo's code — uploading them buried the real
      # dependency CVEs under thousands of "alerts". The counts surface via the
      # PR comment and the job summary; the reports are uploaded as a build
      # artifact. The Security tab is reserved for Trivy/Grype/CodeQL (actual
      # vulnerability scanners).
      - name: Run Ferret Scan on changed files
        if: steps.scope.outputs.scope == 'changed-files' && steps.changed-files.outputs.has_files == 'true'
        env:
          FERRET_BIN: bin/ferret-scan
        run: |
          # Recorded first: from here on the gate step reads <out>/summary.env, and fails closed if
          # the script stops before it writes one.
          echo "scan_ran=true" >> "$GITHUB_ENV"
          echo "self_scan_out=$RUNNER_TEMP/self-scan" >> "$GITHUB_ENV"

          # The script's exit status is this step's: 1 is HIGH in block mode, 2 a scan that failed
          # closed. The gate step reads the same verdict from summary.env.
          scripts/self-scan.sh --scope changed --files changed_files.txt --mode "$GATE_MODE" --out "$RUNNER_TEMP/self-scan"

      - name: Run Ferret Scan on full repository
        if: steps.scope.outputs.scope == 'full-repository'
        env:
          FERRET_BIN: bin/ferret-scan
        run: |
          # Recorded first, as in the changed-files step.
          echo "scan_ran=true" >> "$GITHUB_ENV"
          echo "self_scan_out=$RUNNER_TEMP/self-scan" >> "$GITHUB_ENV"

          # The tree: tracked files plus untracked files git does not ignore (bin/ is ignored). The
          # script's exit status is this step's, as in the changed-files step.
          scripts/self-scan.sh --scope tree --mode "$GATE_MODE" --out "$RUNNER_TEMP/self-scan"

      - name: Create PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCAN_RAN: ${{ env.scan_ran }}
          SELF_SCAN_OUT: ${{ env.self_scan_out }}
          HAS_FILES: ${{ steps.changed-files.outputs.has_files }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const env = process.env;
            const gateMode = env.GATE_MODE || '';

            // The verdict is scripts/self-scan.sh's summary.env (NAME=value lines). No defaults: a
            // value the script did not write is reported as missing, never as 0.
            const isCount = (v) => typeof v === 'string' && /^[0-9]+$/.test(v);
            let summary = null;
            if (env.SCAN_RAN === 'true' && env.SELF_SCAN_OUT) {
              try {
                const text = fs.readFileSync(path.join(env.SELF_SCAN_OUT, 'summary.env'), 'utf8');
                summary = {};
                for (const line of text.split('\n')) {
                  const i = line.indexOf('=');
                  if (i > 0) summary[line.slice(0, i)] = line.slice(i + 1);
                }
              } catch (e) {
                console.log(`Could not read summary.env: ${e.message}`);
                summary = null;
              }
            }
            const counted = summary !== null &&
              [summary.high, summary.suppressed, summary.not_examined, summary.exit].every(isCount);

            let commentBody = '## 🔍 Ferret Scan Results\n\n';

            if (gateMode === 'block') {
              commentBody += '**Gate mode: `block`**: an unsuppressed HIGH finding fails this check.\n\n';
            } else if (gateMode === 'report') {
              commentBody += '**Gate mode: `report`**: HIGH findings are reported here and do not fail this check; ' +
                'a scan that fails or is incomplete still does.\n\n';
            } else {
              commentBody += `**Gate mode: \`${gateMode || 'unset'}\`**: neither \`block\` nor \`report\`, so the gate step fails.\n\n`;
            }

            if (env.SCAN_RAN !== 'true') {
              if (env.HAS_FILES === 'false') {
                commentBody += 'ℹ️ **No files were scanned**: the pull request adds, copies, modifies or renames no file.\n\n';
              } else {
                commentBody += '❌ **The scan did not run**: an earlier step failed. Please check the workflow logs.\n\n';
              }
            } else if (!counted) {
              commentBody += '❌ **Scan did not complete**: scripts/self-scan.sh wrote no readable summary.env, so this ' +
                'run cannot be reported as clean. The scan step\'s log says why.\n\n';
            } else {
              if (summary.exit !== '0' && summary.exit !== '1') {
                commentBody += `❌ **Scan failed closed** (scripts/self-scan.sh exit ${summary.exit}): a scan failed, a file ` +
                  'was not fully examined or a count could not be read. The counts cover what was examined.\n\n';
              } else if (summary.not_examined !== '0') {
                commentBody += `❌ **Scan incomplete**: ${summary.not_examined} file(s) were not fully examined.\n\n`;
              } else if (summary.high === '0') {
                commentBody += '✅ **No unsuppressed HIGH finding.**\n\n';
              } else if (gateMode === 'report') {
                commentBody += `⚠️ **${summary.high} unsuppressed HIGH finding(s)**, reported only (\`GATE_MODE=report\`).\n\n`;
              } else {
                commentBody += `❌ **${summary.high} unsuppressed HIGH finding(s)**: this check fails.\n\n`;
              }
              commentBody += '| HIGH (not suppressed) | suppressed | not fully examined |\n';
              commentBody += '|---|---|---|\n';
              commentBody += `| ${summary.high} | ${summary.suppressed} | ${summary.not_examined} |\n\n`;
              commentBody += 'The scan step\'s log lists each HIGH finding (type, file:line, validator); the reports are ' +
                'in the ferret-scan-results artifact and hold no matched text.\n\n';
            }

            const docs = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/${context.sha}/docs/testing/SELF_SCAN.md`;
            commentBody += 'A new HIGH finding is one of three decisions: a real value is removed, a detector false positive ' +
              `is fixed, a fixture takes a reserved value or a reviewed rule. See [docs/testing/SELF_SCAN.md](${docs}).\n`;

            commentBody += '\n---\n';
            commentBody += '*🤖 This comment was automatically generated by Ferret Scan*';

            // The job summary is written UNCONDITIONALLY, before any API call. It is the
            // only channel that reaches a reviewer on a PR from a fork, where
            // GITHUB_TOKEN is capped at read-only no matter what the permissions block
            // above requests, so createComment can only ever 403.
            await core.summary.addRaw(commentBody).write();

            // A fork PR is detected rather than left to fail, so the log says why no
            // comment appeared instead of reporting a failure that is not one.
            const thisRepo = `${context.repo.owner}/${context.repo.repo}`;
            const headRepo = context.payload.pull_request?.head?.repo?.full_name;
            if (headRepo && headRepo !== thisRepo) {
              core.info(`PR head is ${headRepo}, not ${thisRepo}: GITHUB_TOKEN is read-only ` +
                'for a fork PR, so the results are in the job summary rather than a comment.');
              return;
            }

            // AWAITED, inside a try. Un-awaited, the rejected promise became an unhandled
            // rejection that failed this job (run 35366738323 on #707, which the old count
            // reported as zero findings; ferret's own stats for it were 83 HIGH and 35 MEDIUM,
            // #767); unguarded, any future permission change does it again.
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            } catch (e) {
              core.warning(`Could not post the results comment (status ${e.status || 'unknown'}): ` +
                `${e.message}. The results are in the job summary and the ` +
                'ferret-scan-results artifact; the gate step reads summary.env, not this comment.');
            }

      - name: Upload scan results
        # The script's reports and summary.env; the matched text is in none of them.
        if: always() && env.scan_ran == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferret-scan-results
          path: ${{ env.self_scan_out }}
          retention-days: 30

      - name: Gate on scan result and high confidence findings
        # Runs after every scan, failed or not, and when no scan ran: then it passes only if the
        # changed-files step found the change empty, so a scan skipped for any other reason fails
        # here rather than leaving nothing to check.
        if: always()
        env:
          SCAN_RAN: ${{ env.scan_ran }}
          SELF_SCAN_OUT: ${{ env.self_scan_out }}
          HAS_FILES: ${{ steps.changed-files.outputs.has_files }}
        run: |
          # Fails closed in both modes (see GATE_MODE in the header). The verdict is the script's
          # <out>/summary.env, read with sed and never sourced. An unknown GATE_MODE, no scan where
          # one was due, a summary.env that is missing or holds a count that is not a number, a scan
          # run in another mode, a scan that failed closed (exit 2) or a file not fully examined
          # fails the check. Only HIGH > 0 depends on the mode.
          fail=0
          case "$GATE_MODE" in
            block|report) ;;
            *) echo "❌ GATE_MODE is '$GATE_MODE'; it must be block or report"; fail=1 ;;
          esac

          high="" suppressed="" not_examined="" scope="" mode="" code=""
          counted=false
          if [ "$SCAN_RAN" != "true" ]; then
            if [ "$HAS_FILES" = "false" ]; then
              echo "No files were scanned: the change adds, copies, modifies or renames no file"
            else
              echo "❌ No scan ran, and the changed-files step did not find the change empty; see the steps above"
              fail=1
            fi
          elif [ -z "$SELF_SCAN_OUT" ] || [ ! -f "$SELF_SCAN_OUT/summary.env" ]; then
            echo "❌ ${SELF_SCAN_OUT:-(no out dir)}/summary.env is missing: scripts/self-scan.sh stopped before it scanned; the scan step's log says why"
            fail=1
          else
            summary="$SELF_SCAN_OUT/summary.env"
            field() { sed -n "s/^$1=//p" "$summary"; }
            high="$(field high)"
            suppressed="$(field suppressed)"
            not_examined="$(field not_examined)"
            code="$(field exit)"
            scope="$(field scope)"
            mode="$(field mode)"
            counted=true
            # A count is 1 to 9 digits, so the comparisons below cannot overflow (an overflowing
            # `[ -gt ]` is an error, which an `if` reads as false). A name written twice reads as
            # two lines, which is not a count either.
            for pair in "high=$high" "suppressed=$suppressed" "not_examined=$not_examined" "exit=$code"; do
              case "${pair#*=}" in
                ''|*[!0-9]*|??????????*)
                  echo "❌ ${pair%%=*} is '${pair#*=}' in $summary, not a count"
                  fail=1
                  counted=false ;;
              esac
            done
          fi

          if [ "$counted" = "true" ]; then
            echo "HIGH $high (not suppressed), suppressed $suppressed, not fully examined $not_examined; scope $scope, mode $mode, self-scan exit $code"
            if [ "$mode" != "$GATE_MODE" ]; then
              echo "❌ The scan ran in mode '$mode', but GATE_MODE is '$GATE_MODE'"
              fail=1
            fi
            if [ "$code" -eq 2 ]; then
              echo "❌ scripts/self-scan.sh failed closed (exit 2): a scan failed, a file was not fully examined, or a count could not be read; the scan step's log says which"
              fail=1
            elif [ "$code" -gt 2 ]; then
              echo "❌ scripts/self-scan.sh exited $code, which it never does"
              fail=1
            fi
            if [ "$not_examined" -gt 0 ]; then
              echo "❌ $not_examined file(s) were not fully examined, so findings may be missing"
              fail=1
            fi
            if [ "$high" -gt 0 ] && [ "$GATE_MODE" = "report" ]; then
              echo "⚠️  $high HIGH finding(s) reported; GATE_MODE=report, so they do not fail this check"
            elif [ "$high" -gt 0 ]; then
              echo "❌ Blocking merge: $high HIGH finding(s) that no rule in the ledger covers; the scan step's log lists them"
              fail=1
            fi
          fi

          if [ "$fail" -eq 0 ]; then verdict="passed"; else verdict="failed"; fi
          echo "Gate (GATE_MODE=$GATE_MODE): $verdict"
          docs="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/testing/SELF_SCAN.md"
          {
            echo "**Ferret Scan gate** (\`GATE_MODE=$GATE_MODE\`): **$verdict**"
            echo
            if [ "$SCAN_RAN" != "true" ] && [ "$HAS_FILES" = "false" ]; then
              echo "No files were scanned: the change adds, copies, modifies or renames no file."
            else
              echo "| HIGH (not suppressed) | suppressed | not fully examined | scope | self-scan exit |"
              echo "|---|---|---|---|---|"
              echo "| ${high:-missing} | ${suppressed:-missing} | ${not_examined:-missing} | ${scope:-missing} | ${code:-missing} |"
            fi
            echo
            echo "A new HIGH finding is one of three decisions (a real value, a detector false positive, a fixture): see [docs/testing/SELF_SCAN.md]($docs)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"

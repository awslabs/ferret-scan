name: Promote CHANGELOG on release

# #647: `## [Unreleased]` had swallowed 27 releases because nothing cut it at release time -- and
# the one tool that ever tried (git-chglog, removed in #646) REGENERATED the file from commit
# subjects, destroying the hand-written prose. This workflow does the additive alternative: when a
# release tag is pushed, render the release notes collected for it -- one fragment file per pull
# request under changelog.d/ (#821), plus any old-style bullets still under [Unreleased] -- into a
# dated section right below the [Unreleased] heading, and remove the rendered fragments in the same
# commit. scripts/promote-changelog.sh owns the surgery and its guarantees (byte-preservation of
# every bullet line, idempotence on a re-run, no-op when nothing was collected, hard failure on a
# missing anchor or a malformed fragment); the rendering is internal/tools/changelogrender, hence
# the Go toolchain below.
#
# TRIGGER: the TAG PUSH, not `release: published` -- and that is load-bearing, not a style choice.
# goreleaser publishes the release with the workflow-provided GITHUB_TOKEN, and events performed
# with GITHUB_TOKEN do not trigger workflows (the same rule brew-smoke.yml documents for the
# formula pushes). A `release: published` trigger here would therefore NEVER fire for a real
# release; it was the first version of this file and was caught in review before ever running.
# The tag push is a human action, so it always fires.
#
# ORDERING: this runs concurrently with release.yml on the same tag push, and that is safe by
# construction -- release.yml checks out the TAG while this job commits to MAIN, so the tag never
# points at a post-hoc edit and the release job's tree is never dirtied (#647's two ordering
# requirements). If the release fails and the tag is re-pushed, the promotion is a recorded no-op
# ("heading already exists").
#
# The push can RACE goreleaser[bot]'s brew-formula commit to main, which lands right after the
# release publishes -- hence the rebase-and-retry loop rather than a bare push. The promote commit
# itself cannot re-trigger anything: this workflow fires on tags only, and GITHUB_TOKEN pushes
# trigger no workflows anyway.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to promote [Unreleased] under (vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Full history: the push below rebases onto whatever goreleaser[bot] has pushed in the
          # meantime, and rebasing from a shallow clone fails with "unshallow" errors.
          fetch-depth: 0

      # The renderer is Go; same pinned action and version source as changelog-check.yml.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'

      - name: Promote [Unreleased] to the released tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: ./scripts/promote-changelog.sh "${TAG}"

      # Backstop for the PR-time check (changelog-check.yml). A no-op promotion is correct when the
      # release really changed nothing user-visible, and a silent loss of the release notes when it
      # did not — v2.5.3 was the second kind, and this step had nothing to say. A warning, not a
      # failure: the tag is already public, and the remedy is a follow-up PR adding the entries under
      # the new heading, which a red run here cannot do.
      - name: Warn if a no-op promotion covered user-visible commits
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          # Promoted this run, or by an earlier run of the same tag (a re-push): not a no-op.
          if ! git diff --quiet CHANGELOG.md || grep -qF "## [${TAG}]" CHANGELOG.md; then
            exit 0
          fi
          git fetch --quiet --tags origin
          if ! PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null); then
            echo "No earlier tag before ${TAG}; nothing to compare."
            exit 0
          fi
          NOTABLE=$(git log --format=%s "${PREV}..${TAG}" | grep -E '^(fix|feat|perf)(\([^)]*\))?!?:|^[a-z]+(\([^)]*\))?!:' || true)
          if [ -n "${NOTABLE}" ]; then
            COUNT=$(printf '%s\n' "${NOTABLE}" | wc -l | tr -d ' ')
            echo "::warning title=CHANGELOG::${TAG} promoted nothing, but ${PREV}..${TAG} has ${COUNT} fix/feat/perf or breaking commit(s). Add their entries under '## [${TAG}]' in a follow-up PR."
            # Subjects are contributor-written; the runner's legacy parser acts on "##[" anywhere in a
            # line, so break the sequence before echoing them.
            printf '%s\n' "${NOTABLE}" | sed 's/##\[/# #[/g'
          fi

      - name: Commit and push if the file changed
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "No changelog change to push (idempotent re-run or empty section)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # changelog.d: the script already `git rm`ed the rendered fragments; README.md stays.
          git add -- CHANGELOG.md changelog.d
          git commit -m "chore(changelog): promote [Unreleased] to ${TAG} [skip ci]"
          # goreleaser[bot] pushes the brew formula to main in the same minute; retry over it.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto current main"
            git pull --rebase origin main
          done
          echo "could not push after 5 attempts" >&2
          exit 1

name: Go Tests

on:
  # No `branches:` filter. This job must run on EVERY pull request, including one
  # whose base is another feature branch. Stacked PRs are how larger changes land
  # here, and with a [main, master, develop] filter they received literally zero
  # checks: `gh pr checks` reported "no checks reported on the branch" while a
  # sibling PR based on main got the full matrix. A stacked PR is exactly the case
  # that most needs testing, because it carries its own diff plus its base's.
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-test.yml'
      # The score baseline is data, not code, so it does not match '**.go' — and a
      # baseline-only commit is exactly the commit that most needs checking, because
      # it is how a quality regression gets blessed. Without this line, editing
      # baseline.json to make `make score` pass would receive zero checks.
      - 'internal/scorecorpus/testdata/**'
  push:
    branches: [main, master]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-test.yml'
      # The score baseline is data, not code, so it does not match '**.go' — and a
      # baseline-only commit is exactly the commit that most needs checking, because
      # it is how a quality regression gets blessed. Without this line, editing
      # baseline.json to make `make score` pass would receive zero checks.
      - 'internal/scorecorpus/testdata/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go-version }}
    strategy:
      # Don't cancel the rest when one platform fails — we want full
      # cross-platform coverage on every run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['']  # use .go-version file
    runs-on: ${{ matrix.os }}

    # The growth-ratio guards, named once for the gate step and the report step below. The gate step
    # fails unless every alternative in the pattern matches a test, and every listed package has
    # tests and runs at least one. That check exists because this list once named the detector and
    # SVG packages under a pattern none of their guards matched, so both ran zero tests here and the
    # listing read as coverage that did not exist -- and per-package alone is not enough, because
    # goldencorpus has several TestGrowthRatio* tests, so renaming the 18-validator guard would leave
    # the package "ok" while the guard ran nowhere (it skips under the main suite's -race).
    env:
      COMPLEXITY_GUARDS: 'TestValidatorComplexityIsSubQuadratic|TestGrowthRatio|TestAssignLineColumnsMemoIsLoadBearing|TestManyTextNodesIsSubQuadratic|TestCollapseSpaceIsLinear|TestListTailIsLinearInLineLength|TestCollectionIsLinearInLineLength|TestListGuardRaceGateIsNotTakenWithoutRace'
      COMPLEXITY_PKGS: './internal/goldencorpus/ ./internal/detector/ ./internal/preprocessors/text-extractors/text-extract-svgtextlib/ ./internal/validators/secrets/'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'

      # No separate module-cache step. actions/setup-go already caches BOTH of the paths one would
      # name here -- ~/go/pkg/mod and ~/.cache/go-build -- keyed on go.sum, and it does so by
      # default. A second actions/cache over the same paths does not just duplicate the work, it
      # RELIABLY FAILS: setup-go extracts first, then the second restore tries to write the same
      # files and tar exits 2. Measured, from an ubuntu-latest log:
      #
      #	setup-go:  Cache hit ... Cache Size: ~678 MB ... Cache restored successfully
      #	           /home/runner/go/pkg/mod
      #	           /home/runner/.cache/go-build
      #	cache:     path: ~/.cache/go-build, ~/go/pkg/mod ... Cache Size: ~677 MB
      #	           ##[error]/usr/bin/tar: ...: Cannot open: File exists     (x many)
      #	           ##[warning]Failed to restore: "/usr/bin/tar" failed with exit code 2
      #
      # So every run with a cache hit downloaded ~677 MB a second time and then failed to unpack it.
      # It also correlated with the runs that died: all 3 ubuntu jobs killed by SIGTERM at ~245s had
      # this failure, against 1 of 5 that passed -- suggestive, NOT established, and deliberately not
      # claimed as the cause. Removing a step that always fails is right on its own terms.

      - name: Gofmt
        # Formatting is platform-independent, so gate it on one runner instead of
        # failing three times for the same file. Linux is the fastest of the three.
        #
        # `gofmt -l` prints offending files and exits 0, so the exit status alone
        # proves nothing — the output has to be inspected. Restricted to first-party
        # trees so a vendored or generated file cannot fail the build.
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./pkg)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reported unformatted files; run 'gofmt -w' on them:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt clean"
        shell: bash

      - name: Go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Complexity guards (no race detector)
        # The O(n^2) guards are skipped under -race by the main suite and run here instead. They measure
        # single-goroutine CPU-time ratios, so the detector can find nothing in them, and it costs two
        # things: ~70x memory (101MB -> 6.9-8.1GB on this guard, measured) and accuracy, because it
        # compresses the ratios being compared.
        #
        # The memory is why this exists. ubuntu-latest was SIGTERM'd mid-suite six times with no test
        # reporting FAIL; sampling the machine showed goldencorpus.test growing 1.2GB -> 14.4GB in 45
        # seconds and exhausting 16GB of RAM plus all 3GB of swap. Not a gate that can be dropped --
        # without this step the guards would not run at all.
        run: |
          read -r -a pkgs <<< "$COMPLEXITY_PKGS"
          go test -list "$COMPLEXITY_GUARDS" "${pkgs[@]}" > "$RUNNER_TEMP/complexity.list"
          if grep -F '[no test files]' "$RUNNER_TEMP/complexity.list"; then
            echo "::error title=complexity guards::a package in COMPLEXITY_PKGS has no test files"
            exit 1
          fi
          IFS='|' read -r -a guards <<< "$COMPLEXITY_GUARDS"
          for g in "${guards[@]}"; do
            if ! grep -q "^${g}" "$RUNNER_TEMP/complexity.list"; then
              echo "::error title=complexity guards::COMPLEXITY_GUARDS alternative '${g}' matches no test"
              exit 1
            fi
          done
          # -p 1: one test binary at a time. These are timing guards, and until #731 goldencorpus ran
          # here effectively alone -- the other two packages matched no tests. The first run with all
          # three concurrent hit a zero wall-clock reading on windows-latest that 44 earlier readings
          # never had; serialising restores the condition the evidence was gathered under.
          go test -p 1 -count=1 -run "$COMPLEXITY_GUARDS" "${pkgs[@]}" 2>&1 | tee "$RUNNER_TEMP/complexity.out"
          if grep 'no tests to run' "$RUNNER_TEMP/complexity.out"; then
            echo "::error title=complexity guards::a package above ran zero guards: COMPLEXITY_GUARDS no longer matches its tests"
            exit 1
          fi
        shell: bash

      - name: Report the complexity guard's measured ratios
        # The O(n^2) guard compares a ratio of CPU-time readings against a single threshold (8.0),
        # and that threshold was chosen from measurements taken on ONE platform. It does not hold
        # everywhere: the synthetic-quadratic control read 7.46x and 7.85x on ubuntu-latest -- BELOW
        # its own 8.0 threshold -- against 13.49x-14.06x on darwin/arm64, so on that runner the guard
        # could not detect the regression it exists for.
        #
        # The guard logs every ratio, but `go test` hides t.Logf output for a PASSING package unless
        # -v is set (fmt.Println is hidden too -- both measured), so these numbers have never appeared
        # in any CI log and the threshold has been resting on one machine's. This prints all 18
        # validator targets plus every control, on all three runners, every run. See #599.
        #
        # This step did its job on its first run and the numbers are now recorded at maxGrowthRatio.
        # From run 34281522336 on main: ubuntu 3.30x-4.64x correct / 15.16x quadratic, macos
        # 3.86x-4.65x / 15.49x -- so 8.0 has the repo's 1.5x margin on both sides on both, and the
        # ubuntu concern above is RESOLVED (dropping -race from the guard in #602 removed the
        # amplifier). Windows asserts 0 of 18: its 15.625ms CPU tick leaves every base under the 8
        # ticks perfguard requires, so the tick gate declines them all. KEEP THIS STEP -- it is how
        # the next retune gets evidence instead of a failure, and it is the only place the Windows
        # skips are visible.
        #
        # Placed after Build rather than after the test step ON PURPOSE: the granularity step added by
        # #597 anchors after the test step, and two insertions at the same point conflict -- measured
        # with a real merge, not guessed. Running before the main suite is equivalent for a
        # continue-on-error reporting step.
        #
        # Every asserted reading also prints a "margin" line naming its distance from the bound and the
        # runner image, and a margin under 1.5x is raised as a ::warning annotation on the run
        # (perfguard.ReportMargin). That is printed straight to stdout, and like t.Logf it is visible
        # for a passing package only under -v -- which is why the detector and SVG guards are listed
        # here too: until #731 their readings had never appeared in any log.
        #
        # continue-on-error: this is observation, not a gate. The assertions run in the suite proper.
        #
        # The detector line-memo guard is also read under -race, because the main suite asserts it
        # there and a -race margin is a different population from the plain one (measured: 458-495MB
        # peak RSS for this one test).
        run: |
          read -r -a pkgs <<< "$COMPLEXITY_PKGS"
          go test -p 1 -v -count=1 -run "$COMPLEXITY_GUARDS" "${pkgs[@]}"
          go test -race -v -count=1 -run 'TestAssignLineColumnsMemoIsLoadBearing' ./internal/detector/
        shell: bash
        continue-on-error: true

      - name: Test (with race detector)
        # -race only works on amd64/arm64 platforms Go supports — all three
        # runners qualify. Race detector roughly halves throughput but
        # catches concurrency bugs we can't catch otherwise.
        #
        # tests/integration/ is excluded from CI: the Windows-only files in
        # there have multiple pre-existing bugs (strings.Repeat with
        # negative count panics on the long-path test, architecture cross-
        # build assumptions, error-message assertions that don't match
        # actual binary output). Tracked separately from production-code
        # quality. Run them locally on Windows when working on those tests.
        run: go test -race -count=1 $(go list ./... | grep -v /tests/integration)
        shell: bash

      - name: Report this runner's clock granularity
        # internal/perfguard measures algorithmic growth as a ratio of CPU-time readings, and the
        # threshold it will divide by (MinMeasurableCPU) is a fixed 2ms on every platform. Whether
        # 2ms is enough depends entirely on the runner's clock granularity, which nobody had
        # measured -- the constant's own doc comment asserts "15.6ms on Windows by default" without
        # evidence, and if that is right then a Windows reading between 2ms and 15.6ms clears the
        # gate while still being a single quantised tick.
        #
        # The test polls each clock and logs the granularity plus how many ticks the gate is worth.
        # It runs in the step above too, but `go test` hides t.Logf output for a PASSING package
        # unless -v is set (fmt.Println is hidden as well -- both were measured), so without this
        # step the numbers are computed on all three platforms every run and never seen. This step
        # is what makes them observable, which is the whole point of collecting them.
        #
        # Deliberately `continue-on-error`: this reports a characteristic of the machine, it does
        # not gate the build. The assertions it carries -- monotonicity of ProcessCPUTime, and a
        # non-vacuity floor -- are enforced by the real run above.
        run: go test -v -count=1 -run 'TestClockGranularityIsReportedAndCPUTimeIsMonotonic' ./internal/perfguard/
        shell: bash
        continue-on-error: true

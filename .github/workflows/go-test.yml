name: Go Tests

on:
  # No `branches:` filter. This job must run on EVERY pull request, including one
  # whose base is another feature branch. Stacked PRs are how larger changes land
  # here, and with a [main, master, develop] filter they received literally zero
  # checks: `gh pr checks` reported "no checks reported on the branch" while a
  # sibling PR based on main got the full matrix. A stacked PR is exactly the case
  # that most needs testing, because it carries its own diff plus its base's.
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-test.yml'
      # The score baseline is data, not code, so it does not match '**.go' — and a
      # baseline-only commit is exactly the commit that most needs checking, because
      # it is how a quality regression gets blessed. Without this line, editing
      # baseline.json to make `make score` pass would receive zero checks.
      - 'internal/scorecorpus/testdata/**'
  push:
    branches: [main, master]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-test.yml'
      # The score baseline is data, not code, so it does not match '**.go' — and a
      # baseline-only commit is exactly the commit that most needs checking, because
      # it is how a quality regression gets blessed. Without this line, editing
      # baseline.json to make `make score` pass would receive zero checks.
      - 'internal/scorecorpus/testdata/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go-version }}
    strategy:
      # Don't cancel the rest when one platform fails — we want full
      # cross-platform coverage on every run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['']  # use .go-version file
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Gofmt
        # Formatting is platform-independent, so gate it on one runner instead of
        # failing three times for the same file. Linux is the fastest of the three.
        #
        # `gofmt -l` prints offending files and exits 0, so the exit status alone
        # proves nothing — the output has to be inspected. Restricted to first-party
        # trees so a vendored or generated file cannot fail the build.
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l ./cmd ./internal ./pkg)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reported unformatted files; run 'gofmt -w' on them:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt clean"
        shell: bash

      - name: Go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (with race detector)
        # -race only works on amd64/arm64 platforms Go supports — all three
        # runners qualify. Race detector roughly halves throughput but
        # catches concurrency bugs we can't catch otherwise.
        #
        # tests/integration/ is excluded from CI: the Windows-only files in
        # there have multiple pre-existing bugs (strings.Repeat with
        # negative count panics on the long-path test, architecture cross-
        # build assumptions, error-message assertions that don't match
        # actual binary output). Tracked separately from production-code
        # quality. Run them locally on Windows when working on those tests.
        run: |
          # DIAGNOSTIC BRANCH ONLY. ubuntu-latest has been killed by SIGTERM ("the runner has received
          # a shutdown signal") 6+ times, always mid-suite at 244-306s, never on windows or macos, with
          # no test reporting FAIL. Six hypotheses are eliminated by measurement: test-suite OOM,
          # -race compile OOM, disk exhaustion, concurrency cancellation, a configured timeout, and the
          # redundant cache step (removed in #602 -- the SIGTERM happened anyway with the tar failure
          # absent). Local measurement cannot settle it: this repo is developed on darwin/arm64, and
          # ThreadSanitizer's shadow mapping is a different size on linux/amd64, so extrapolating is
          # exactly the assumption that has been wrong twice already.
          #
          # So sample the machine WHILE the suite runs and let the runner answer. Total memory across
          # all processes, not one process's RSS -- `go test` runs up to GOMAXPROCS race-instrumented
          # binaries concurrently, so the sum is the number that matters and the one no local tool here
          # reported.
          echo "::group::machine"
          nproc; free -m; df -h /; ulimit -a
          echo "::endgroup::"
          ( while true; do
              printf '[SAMPLE t=%ss] mem: ' "$SECONDS"
              free -m | awk '/^Mem:/{printf "used=%sMB avail=%sMB", $3, $7}'
              printf ' | swap: '
              free -m | awk '/^Swap:/{printf "used=%sMB", $3}'
              printf ' | disk: '
              df -m / | awk 'NR==2{printf "avail=%sMB", $4}'
              printf ' | top-rss: '
              ps -eo rss,comm --sort=-rss | awk 'NR>1 && NR<5{printf "%s=%sMB ", $2, int($1/1024)}'
              echo
              sleep 15
            done ) &
          SAMPLER=$!
          trap 'kill $SAMPLER 2>/dev/null || true' EXIT
          go test -race -count=1 $(go list ./... | grep -v /tests/integration)
        shell: bash
        timeout-minutes: 25

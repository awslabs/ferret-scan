name: Build Python Package

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      package-path:
        description: "Path to built Python package"
        value: ${{ jobs.test-and-release.outputs.package-path }}

permissions:
  contents: write # Needed for creating releases

jobs:
  build:
    uses: ./.github/workflows/build-shared.yml
    with:
      build-type: "python"
    permissions:
      contents: read

  test-and-release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # Needed for creating releases
    outputs:
      package-path: python-package/dist/

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download Python package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ferret-scan-python-${{ github.sha }}
          path: python-package/dist/

      - name: Test installation and functionality
        run: |
          cd python-package
          pip install dist/*.whl

          # Test version
          ferret-scan --version

          # Test basic functionality
          echo "Test credit card: 4111-1111-1111-1111" > test.txt
          ferret-scan --file test.txt --confidence high || true
          rm test.txt

          # Test help
          ferret-scan --help | head -5

          echo "✅ Python package installation and basic functionality tests passed"

      - name: Upload Python package artifacts (final)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-release
          path: python-package/dist/
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: python-package/dist/*
          generate_release_notes: true
          body: |
            ## 🐍 Python Package Installation

            ```bash
            pip install ferret-scan
            ```

            ### Quick Start:
            ```bash
            ferret-scan --version
            ferret-scan --help
            ```

            **Requirements**: Python 3.7 or higher

            ---

            **Note**: The PyPI package will be available shortly after this release is published.

  # Publish to PyPI for tag pushes (trusted publisher should be configured for this workflow)
  publish-to-pypi:
    runs-on: ubuntu-latest
    needs: test-and-release
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      contents: read
      id-token: write # Required for trusted publishing to PyPI

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine setuptools_scm

      - name: Download Python package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-release
          path: python-package/dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (2026-04-07)
        with:
          packages-dir: python-package/dist/
          verbose: true
          # A re-pushed tag (e.g. re-cut release after a goreleaser failure)
          # re-runs this job; PyPI filenames are immutable, so a duplicate
          # upload otherwise fails the whole run with "400 File already
          # exists" even though nothing is wrong. skip-existing makes tag
          # re-pushes idempotent while still failing on genuine errors.
          skip-existing: true

  # Mirror the SAME artefact onto Test PyPI, on the same trigger as production.
  #
  # TestPyPI had drifted to 2.4.0 while PyPI was on 2.4.4 -- four releases behind -- because the only
  # route to it was a manual `pypi-publish.yml` dispatch with action=publish-testpypi, and nobody runs
  # that on a release. A stale TestPyPI is worse than an empty one: it is the index you reach for when
  # rehearsing an install problem, and it was quietly answering for a version nobody was running.
  #
  # A SEPARATE JOB, not another step in publish-to-pypi, because `environment:` is per-job and PyPI's
  # trusted publishing binds the OIDC token to it. One job cannot be in two environments, so a second
  # upload from inside publish-to-pypi would present the `pypi` environment to TestPyPI.
  #
  # PARALLEL with production (needs: test-and-release, not needs: publish-to-pypi), so mirroring never
  # delays the real publish, and it uses the same `python-package-release` artefact -- the mirror is the
  # same bytes that went to PyPI, not a rebuild that could differ.
  publish-to-testpypi:
    runs-on: ubuntu-latest
    needs: test-and-release
    if: startsWith(github.ref, 'refs/tags/')
    # NEVER fail a release because the mirror failed. TestPyPI is a convenience index with no
    # availability promise, and its trusted-publisher config is separate from PyPI's -- neither an
    # outage nor a misconfiguration there may turn a good release red.
    continue-on-error: true
    environment: testpypi
    permissions:
      contents: read
      id-token: write # Required for trusted publishing to Test PyPI

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Download Python package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-release
          path: python-package/dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (2026-04-07)
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: python-package/dist/
          verbose: true
          # Same reasoning as production: filenames are immutable, so a re-pushed tag must not fail on
          # a duplicate. Doubly true here, where a manual dispatch may already have uploaded this
          # version by hand.
          skip-existing: true

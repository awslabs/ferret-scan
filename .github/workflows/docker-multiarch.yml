name: Multi-Architecture Docker Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - '**.go'
      - 'internal/web/assets/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'cmd/**'
      - 'internal/**'
      - 'Makefile'
      - 'scripts/container-redaction-smoke.sh'
  pull_request:
    branches:
      - main
      - master
    paths:
      # The workflow itself, so a pull request that edits it runs it.
      - '.github/workflows/docker-multiarch.yml'
      - '**.go'
      - 'internal/web/assets/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'cmd/**'
      - 'internal/**'
      - 'Makefile'
      - 'scripts/container-redaction-smoke.sh'
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms (comma-separated)"
        required: false
        default: "linux/amd64,linux/arm64"
        type: string
      push_image:
        description: "Push image to registry"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write # Required for GHCR push
  security-events: write
  id-token: write # Required for AWS OIDC

env:
  ECR_REGISTRY: public.ecr.aws/g4m5x5s3
  ECR_REPOSITORY: ferret-scan
  GHCR_REGISTRY: ghcr.io
  GHCR_REPOSITORY: awslabs/ferret-scan

jobs:
  docker:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Needed for SBOM action to attach to releases
      packages: write # Required for GHCR push
      id-token: write # Required for AWS OIDC
      security-events: write
    outputs:
      # The tag this run pushed (`main` on a main push, the semver on a tag). security-scan
      # reads it so the vulnerability scan covers the image this commit built.
      image_version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: all

      - name: Configure AWS credentials
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-ECR-Push

      - name: Log in to Amazon ECR Public
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      # Pull requests build the Dockerfile too, and its builder stage is pulled from ECR Public.
      # Unauthenticated pulls there are rate-limited per source IP, and GitHub-hosted runners share
      # their egress addresses, so PR builds fail with `429 Too Many Requests` on the builder image's
      # manifest -- eight PR runs between 2026-10-20 and 2026-10-24, every one green on a re-run with
      # no change to the branch (#809). An authenticated pull is not rate-limited that way.
      #
      # Deliberately NOT the two steps above. AWS_ROLE_ARN is the role that PUSHES the release image,
      # and a pull_request workflow runs the PR's own copy of this file: widening those steps to PRs
      # would let any same-repository PR edit the push condition and publish an image with the release
      # credentials, a review-bypass this repository does not have today. The PR path therefore uses a
      # SEPARATE role, read-only (ecr-public:GetAuthorizationToken and sts:GetServiceBearerToken, nothing
      # else), named by the repository variable ECR_PUBLIC_PULL_ROLE_ARN with a trust policy that admits
      # the `repo:awslabs/ferret-scan:pull_request` subject. Until that variable is set these steps are
      # skipped and the PR build pulls anonymously, which the retry below is for. Fork PRs never run
      # them: a fork cannot mint this repository's OIDC token, and the retry is what they get.
      - name: Configure AWS credentials for a read-only base-image pull (same-repository PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.ECR_PUBLIC_PULL_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ECR_PUBLIC_PULL_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-ECR-Pull

      - name: Log in to Amazon ECR Public for the base-image pull (same-repository PRs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.ECR_PUBLIC_PULL_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GHCR access
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          ACTOR: ${{ github.actor }}
        run: |
          echo "🔍 Verifying GHCR access..."
          echo "Actor: $ACTOR"
          echo "Repository: ${{ github.repository }}"
          echo "Repository owner: ${{ github.repository_owner }}"

          # Test if we can access the repository
          if docker manifest inspect "ghcr.io/${GHCR_REPOSITORY}:latest" >/dev/null 2>&1; then
            echo "✅ Can access existing images"
          else
            echo "ℹ️ No existing images found (this is normal for first push)"
          fi

      - name: Extract metadata for multi-registry
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}
          tags: |
            # For tagged releases: create version tag + latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            # For main branch: create main tag (development builds)
            type=raw,value=main,enable={{is_default_branch}}
            # For PRs: only create PR tag (no push)
            type=ref,event=pr,enable=${{github.event_name == 'pull_request'}}
          labels: |
            org.opencontainers.image.title=Ferret Scan
            org.opencontainers.image.description=Multi-architecture sensitive data detection tool
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}

      - name: Determine platforms
        id: platforms
        # The platforms input is free-text workflow_dispatch input; pass via env
        # and reference as "$VAR" so it cannot inject shell commands (GitHub
        # Actions script-injection hardening).
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PLATFORMS: ${{ github.event.inputs.platforms }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "platforms=$INPUT_PLATFORMS" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            # Only build for amd64 on PRs for faster feedback
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            # Full multi-arch build for main branch and tags
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi

      # Redaction inside the image, run the way a user runs it, BEFORE anything is pushed (#776).
      # Every --enable-redaction run in the shipped image panicked at exit 2, and nothing here saw
      # it: the image test below runs only --version and --help, only after a push, and treats a
      # failure as a warning. This loads the amd64 image into the runner's daemon on every event,
      # pull requests included, with the same build arguments as the build below so the two
      # share the builder's layer cache.
      - name: Build image for the redaction smoke test
        id: smoke_build
        # A failure here does not end the job: the step below retries it after a backoff when the
        # cause is the registry's rate limit, and fails the job itself for any other cause.
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ferret-scan:smoke
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          provenance: false
          sbom: false

      # Retry the smoke build when the first attempt failed. Every one of the eight PR failures in
      # #809 was this step failing to fetch the builder image's manifest with `429 Too Many Requests`
      # (the registry's second line reads `toomanyrequests: Data limit exceeded`) from the anonymous
      # pull. Waiting is not enough: the first run of this step on #814 retried the same registry three
      # times over four minutes and was refused every time, because the runner's shared egress address
      # stays over the limit for longer than a job can wait. So the retries pull the SAME builder image
      # from a different registry. `public.ecr.aws/docker/library` is the Docker Official Images mirror,
      # and Docker Hub and mirror.gcr.io serve the identical, content-addressed index: checked for both
      # the 1.27.2 and 1.27.3 pins, the three registries answer the tag with the same sha256 and all
      # serve the digest. The Dockerfile's `@sha256` pin is what fixes the content (TM-10), and buildkit
      # verifies it on pull whichever host answers, so the fallback changes where the bytes come from
      # and nothing about which bytes are built. The committed Dockerfile is not edited: the FROM line's
      # host is rewritten in a copy under RUNNER_TEMP for the retry only, and the step refuses to run if
      # the rewrite finds nothing to change.
      #
      # Attempts: once more from the primary registry at once (a rate-limited pull fails at manifest
      # resolution in seconds, which is also what classifies the failure), then mirror.gcr.io at once,
      # 60 s and 120 s. Same platform, tag and build arguments as the step above; only the GitHub Actions
      # layer cache is omitted, because its credentials are injected by the action and are not available
      # to a shell step, and a cold amd64 build is a few minutes. A failure whose log shows no rate limit
      # is not retried, so a Dockerfile that genuinely does not build fails once with its own error. No
      # retry action is added: this file pins every action by commit, and a wrapper would be a new third
      # party in the supply chain for a loop of a few lines.
      - name: Retry the smoke build after a registry rate limit
        if: steps.smoke_build.outcome == 'failure'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          PRIMARY_HOST_PATH: public.ecr.aws/docker/library/golang
          FALLBACK_HOST_PATH: mirror.gcr.io/library/golang
        run: |
          set -uo pipefail
          fallback="${RUNNER_TEMP}/Dockerfile.fallback-registry"
          sed -E "s#^FROM ${PRIMARY_HOST_PATH}:#FROM ${FALLBACK_HOST_PATH}:#" ./Dockerfile > "$fallback"
          if ! grep -qE "^FROM ${FALLBACK_HOST_PATH}:[^ ]*@sha256:[a-f0-9]{64} " "$fallback"; then
            echo "::error::the Dockerfile's builder FROM line is not '${PRIMARY_HOST_PATH}:<tag>@sha256:<digest>'; update PRIMARY_HOST_PATH in this step"
            exit 1
          fi
          attempt=0
          for spec in "0 ./Dockerfile" "0 $fallback" "60 $fallback" "120 $fallback"; do
            pause="${spec%% *}"; dockerfile="${spec#* }"
            attempt=$((attempt + 1))
            if [ "$pause" -gt 0 ]; then
              echo "waiting ${pause}s before retry ${attempt}"
              sleep "$pause"
            fi
            if [ "$dockerfile" = "./Dockerfile" ]; then
              echo "retry ${attempt}: builder image from the primary registry (${PRIMARY_HOST_PATH})"
            else
              echo "retry ${attempt}: builder image from the fallback registry (${FALLBACK_HOST_PATH}), same digest"
            fi
            log="${RUNNER_TEMP}/smoke-retry-${attempt}.log"
            if docker buildx build \
                --platform linux/amd64 \
                --load \
                --tag ferret-scan:smoke \
                --build-arg "VERSION=${VERSION}" \
                --build-arg "GIT_COMMIT=${GIT_COMMIT}" \
                --build-arg "BUILD_DATE=${BUILD_DATE}" \
                --provenance=false \
                --sbom=false \
                --file "$dockerfile" \
                . 2>&1 | tee "$log"; then
              echo "smoke build succeeded on retry ${attempt}"
              exit 0
            fi
            if ! grep -qiE "429 Too Many Requests|toomanyrequests" "$log"; then
              echo "::error::smoke build retry ${attempt} failed for a reason other than a registry rate limit; not retrying"
              exit 1
            fi
          done
          echo "::error::smoke build still rate-limited after ${attempt} retries across both registries (see #809)"
          exit 1

      - name: Smoke-test redaction in the image
        run: scripts/container-redaction-smoke.sh ferret-scan:smoke

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.platforms.outputs.platforms }}
          # Only push on tags (releases) or main branch pushes, not PRs
          push: ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Generate SBOM
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom.spdx.json
        continue-on-error: true # Don't fail workflow if SBOM generation fails

      - name: Upload SBOM
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30

      - name: Run Trivy vulnerability scanner
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:${{ steps.meta.outputs.version }}
          format: "sarif"
          output: "trivy-results.sarif"
          # Suppress accepted, non-actionable findings (see .trivyignore for the
          # rationale behind each entry — e.g. deprecated packages with no fix
          # that ferret-scan does not actually import).
          trivyignores: ".trivyignore"

      - name: Upload Trivy scan results to GitHub Security tab
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-container-scan"
        continue-on-error: true # Don't fail the workflow if SARIF upload fails

      - name: Test multi-arch images
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        # PLATFORMS derives from the untrusted platforms input and IMAGE_VERSION
        # from the metadata action; pass via env and reference as "$VAR" so
        # neither can inject shell commands.
        env:
          PLATFORMS: ${{ steps.platforms.outputs.platforms }}
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "🧪 Testing built images..."

          # Test each platform
          for platform in $(echo "$PLATFORMS" | tr ',' ' '); do
            echo "Testing $platform..."

            # Test GHCR image
            docker run --rm --platform="$platform" \
              "${GHCR_REGISTRY}/${GHCR_REPOSITORY}:${IMAGE_VERSION}" \
              --version || echo "⚠️ GHCR version check failed for $platform"

            docker run --rm --platform="$platform" \
              "${GHCR_REGISTRY}/${GHCR_REPOSITORY}:${IMAGE_VERSION}" \
              --help | head -5 || echo "⚠️ GHCR help check failed for $platform"
          done

      - name: Create release summary
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        # IMAGE_TAGS/PLATFORMS derive from the metadata action and the untrusted
        # platforms input; pass via env and reference as "$VAR" so they cannot
        # inject shell commands. The registry/repository names are workflow-level
        # env constants, referenced directly as shell vars.
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          PLATFORMS: ${{ steps.platforms.outputs.platforms }}
        run: |
          echo "## 🐳 Multi-Architecture Docker Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Container Registries" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Amazon ECR Public" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${ECR_REGISTRY}/${ECR_REPOSITORY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Gallery:** https://gallery.ecr.aws/g4m5x5s3/ferret-scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "#### GitHub Container Registry" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${GHCR_REGISTRY}/${GHCR_REPOSITORY}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Packages:** https://github.com/awslabs/ferret-scan/pkgs/container/ferret-scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tags:** $IMAGE_TAGS" | tr ',' '\n' | sed 's/^/- `/' | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms:** $PLATFORMS" | tr ',' '\n' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Usage Examples:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "# Pull from GitHub Container Registry" >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${GHCR_REGISTRY}/${GHCR_REPOSITORY}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "# Pull from Amazon ECR Public" >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "# Run CLI mode" >> "$GITHUB_STEP_SUMMARY"
          echo "docker run --rm -v \$(pwd):/data ${GHCR_REGISTRY}/${GHCR_REPOSITORY}:latest --file /data/sample.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "# Run web mode" >> "$GITHUB_STEP_SUMMARY"
          echo "docker run --rm -p 8080:8080 ${GHCR_REGISTRY}/${GHCR_REPOSITORY}:latest --web --port 8080" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  security-scan:
    runs-on: ubuntu-24.04
    needs: docker
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read # Required to pull from GHCR for scanning
      security-events: write

    steps:
      # Check out so Grype can read .grype.yaml (accepted-vuln ignore rules).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Authenticate to GHCR before grype attempts to pull the image.
      # Without this, anchore/scan-action@v7+ fails with
      #   "UNAUTHORIZED: authentication required"
      # because the GHCR package is private by default and the v7 grype
      # resolver requires explicit auth on the oci-registry path.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scan the tag THIS run pushed, not `:latest`. `:latest` only moves on a release tag, so on
      # a push to main the old target was the previous release: its findings were filed against
      # the main commit that had just been built, and a fix on main could never clear them. That is
      # how nine Go 1.27.1 stdlib alerts sat on `main` for a week after the builder moved to 1.27.2
      # (#755) -- the `:main` image was already clean. The Trivy step above has always scanned the
      # built tag; this now matches it.
      - name: Run Grype vulnerability scanner on GHCR
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan-ghcr
        with:
          image: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REPOSITORY }}:${{ needs.docker.outputs.image_version }}
          fail-build: false
          severity-cutoff: high
          # Load accepted-vuln ignore rules (see .grype.yaml for rationale).
          config: ".grype.yaml"

      - name: Upload Grype scan results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.scan-ghcr.outputs.sarif }}
          category: "grype-container-scan"
        continue-on-error: true # Don't fail the workflow if SARIF upload fails

name: CHANGELOG

# Fails a pull request that changes what a release ships without adding a release-note fragment
# under changelog.d/, and any pull request that adds an entry under [Unreleased] in CHANGELOG.md or
# a fragment the release could not render. The rules and the evidence for them live in
# internal/tools/changelogcheck/check.go, the fragment format in internal/tools/changelogfrag; this
# file only feeds the check the PR.
#
# WHY AT PR TIME. The release-time promotion (changelog-promote.yml) can only render what is already
# written, and v2.5.3 shipped four binary-changing PRs with nothing written: promotion found nothing
# and correctly did nothing. The author of the PR is the one person who knows what changed, and this
# is the last moment they are looking.
#
# WHY FRAGMENTS (#821). Entries used to go under [Unreleased] in CHANGELOG.md, at the same few lines
# for every PR, so any two PRs open at once conflicted when the second merged. A new file per PR
# cannot conflict with another PR's new file.
#
# WHY THE MERGE RESULT. actions/checkout on a pull_request event checks out refs/pull/N/merge, so
# HEAD^1 is the base tip and HEAD is what main will contain after the merge.
#
# NO AFTER-MERGE JOB. Until #821 a second job ran on every push to main and failed when a release
# promoted while a PR was open had carried the PR's entry, by a clean three-way merge, into the
# section that release had just promoted. A fragment is a file of its own that no release moves, so
# that failure no longer has a mechanism; the job and the push trigger it needed are gone.
on:
  pull_request:
    # edited: the title (a `type!:` breaking marker) and the base branch are inputs.
    # labeled/unlabeled: `no-changelog`.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the merge result and its base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'

      # PR fields go through env, never through ${{ }} inside `run:` — a title is attacker-chosen
      # text on a fork PR, and interpolating it into the script is shell injection.
      - name: Check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: go run ./internal/tools/changelogcheck
